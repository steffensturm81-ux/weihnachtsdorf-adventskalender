<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#14253b"><title>Unser Weihnachtsdorf 🎄</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#14253b;color:white;font-family:Georgia,serif}main{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#14253b url('winterdorf.jpg') center center/cover no-repeat}main:before{content:"";position:absolute;inset:0;background:linear-gradient(#071b33a6,transparent 30%,transparent 70%,#071b3377);pointer-events:none}header{position:absolute;top:2%;left:8%;right:8%;text-align:center;text-shadow:0 2px 10px #071729;pointer-events:none}h1{font-weight:normal;font-size:clamp(24px,4vw,47px);margin:0;letter-spacing:.04em}header p{font-size:clamp(12px,1.7vw,19px);margin:5px}#doors{position:absolute;inset:0;pointer-events:none}.door{position:absolute;width:5.5%;min-width:25px;aspect-ratio:1;border:1px solid #e8c37e;border-radius:6px;background:linear-gradient(140deg,#7d4129e8,#40242be8);box-shadow:0 0 0 2px #382421bb,0 2px 14px #071625,inset 0 0 10px #c89a4b;color:#fff0c8;font:clamp(13px,2vw,23px) Georgia,serif;text-shadow:0 1px 3px black;pointer-events:auto;cursor:pointer}.door:active{transform:scale(1.1)}.door.opened{background:linear-gradient(135deg,#c79b4d,#77522c)}#snow{position:absolute;inset:0;overflow:hidden;pointer-events:none}.flake{position:absolute;top:-8%;color:#fff;opacity:.75;animation:fall linear infinite;will-change:transform}@keyframes fall{to{transform:translate3d(35px,115vh,0)}}#clock{position:absolute;bottom:2%;right:2%;padding:7px 12px;background:#0b2138c7;border-radius:9px;font:13px Arial,sans-serif}#hint{position:absolute;bottom:2%;left:2%;font:12px Arial,sans-serif;text-shadow:0 1px 5px black}#preview{position:absolute;top:2%;right:2%;border:1px solid #d6bc8b;border-radius:12px;background:#172b40d9;color:white;padding:8px 10px;font:12px Arial,sans-serif;cursor:pointer}#preview.active{background:#925b2e}#modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#061522d9;z-index:5;padding:15px}#modal.show{display:flex}.panel{width:min(500px,94vw);max-height:86vh;overflow:auto;background:linear-gradient(145deg,#fff4db,#dfc699);color:#4b3025;border:5px double #ad813d;border-radius:20px;box-shadow:0 15px 50px #000a;text-align:center;padding:24px}.panel h2{font-size:27px;margin:0 0 12px}.panel p{font-size:19px;line-height:1.5}.panel button{border:0;border-radius:20px;background:#713c2f;color:white;padding:11px 25px;font-size:16px}@media(prefers-reduced-motion:reduce){.flake{animation:none}}@media(orientation:portrait){h1{font-size:23px}.door{min-width:24px}}
</style></head><body><main><div id="snow"></div><header><h1>Unser Weihnachtsdorf</h1><p>24 kleine Momente voller Weihnachtszauber ✨</p></header><div id="doors"></div><button id="preview" aria-pressed="false">Vorschau: Aus</button><div id="hint">🎄 Tippe auf ein Türchen</div><div id="clock"></div><div id="modal" role="dialog" aria-modal="true"><div class="panel"><h2 id="mt"></h2><p id="msg"></p><button id="close">Schließen ✨</button></div></div></main><script>
(function(){'use strict';var surprises=['Heute beginnt unser Weihnachtszauber! Gib jemandem eine riesige Umarmung. ❤️','Finde heute drei Dinge, die dich glücklich machen. 🌟','Sing dein Lieblingsweihnachtslied! 🎵','Bastle einen kleinen Stern aus Papier. ⭐','Sag jemandem, warum du ihn lieb hast. 💌','Nikolaus! Schau nach, ob eine kleine Überraschung auf dich wartet. 🎅','Trinke heute einen leckeren Kakao. ☕','Baue einen Schneemann aus Schnee, Watte oder Papier. ⛄','Was wünschst du dir für andere? 💫','Suche das schönste Weihnachtslicht in eurer Umgebung. 🕯️','Male ein Rentier mit einer roten Nase. 🦌','Macht ein lustiges Familienfoto. 📷','Lest gemeinsam eine Weihnachtsgeschichte. 📖','Verstecke einen lieben Zettel für jemanden. 💕','Tanze zu einem Weihnachtslied. 💃','Welche fünf Dinge glitzern heute? ✨','Verziert gemeinsam ein Plätzchen. 🍪','Kuschelt euch zusammen und schaut einen Weihnachtsfilm. 🎬','Bastle ein winziges Geschenk aus Papier. 🎁','Erfinde einen Namen für ein Weihnachtsrentier. 🦌','Geheime Mission: Bring jemanden zum Lachen! 😄','Bewundert zusammen die Weihnachtsdekoration. 🎄','Bereite dem Weihnachtsmann einen lieben Gruß vor. 💌','Frohe Weihnachten! Das größte Geschenk ist die Zeit miteinander. ❤️'];var pos=[[8,29],[20,34],[32,29],[44,35],[56,30],[68,34],[82,28],[11,46],[23,49],[35,45],[47,50],[59,45],[71,49],[86,46],[8,63],[20,68],[32,62],[44,68],[56,62],[68,68],[80,62],[89,73],[34,83],[63,82]];var doors=document.getElementById('doors'),modal=document.getElementById('modal'),preview=false;function stored(n){try{return localStorage.getItem('weihnachtsdorf2026-'+n)==='1'}catch(e){return false}}function save(n){try{localStorage.setItem('weihnachtsdorf2026-'+n,'1')}catch(e){}}function available(n){var d=new Date();return preview||(d.getFullYear()===2026&&d.getMonth()===11&&d.getDate()>=n)||(d.getFullYear()>2026)}function show(n){document.getElementById('mt').textContent='Türchen '+n+' 🎁';if(available(n)){document.getElementById('msg').textContent=surprises[n-1];save(n);render()}else{document.getElementById('msg').textContent='Dieses Türchen öffnet sich am '+n+'. Dezember. Noch etwas Geduld! ❄️'}modal.className='show'}function render(){doors.innerHTML='';pos.forEach(function(p,i){var n=i+1,b=document.createElement('button');b.className='door'+(stored(n)?' opened':'');b.textContent=n;b.setAttribute('aria-label','Türchen '+n);b.style.left='calc('+p[0]+'% - 2.75%)';b.style.top='calc('+p[1]+'% - 2.75%)';b.onclick=function(){show(n)};doors.appendChild(b)})}document.getElementById('close').onclick=function(){modal.className=''};modal.onclick=function(e){if(e.target===modal)modal.className=''};document.getElementById('preview').onclick=function(){preview=!preview;this.textContent='Vorschau: '+(preview?'An':'Aus');this.className=preview?'active':'';this.setAttribute('aria-pressed',String(preview));render()};function clock(){var d=new Date();document.getElementById('clock').textContent=d.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'long'})+' · '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}clock();setInterval(clock,30000);render();var snow=document.getElementById('snow');for(var i=0;i<40;i++){var f=document.createElement('span');f.className='flake';f.textContent='•';f.style.left=Math.random()*100+'%';f.style.fontSize=(5+Math.random()*9)+'px';f.style.animationDuration=(13+Math.random()*19)+'s';f.style.animationDelay=(-Math.random()*30)+'s';snow.appendChild(f)}})();
</script></body></html>
